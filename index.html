<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- ZOOM 100% -->

  <link rel="shortcut icon" href="TPB.ico" type="image/x-icon">
  <link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:700&display=swap" rel="stylesheet">

  <style>
    /* ZOOM 100% */
    html {
      zoom: 100%;
    }

    body {
      background-color: #ffffff;
      margin: 0;
      padding: 0;
    }

    .navbar {
      overflow: hidden;
      background-color: #ffffff;
      position: fixed;
      top: 0;
      width: 100%;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: flex-end; /* Alinha o botão à direita */
      padding-right: 16px; /* Espaço da borda direita */
      z-index: 9999;
    }

    .navbar2 {
      overflow: hidden;
      background-color: #fecc00;
      position: fixed;
      bottom: 0;
      width: 100%;
      height: 40px;
      z-index: 9999;
    }

    .border {
      border: 1px solid #ffffff;
    }

    .donate-image {
      height: 20px;
      cursor: pointer;
    }

    iframe {
      width: 100%;
      height: 586px;
      border: none;
      display: block;
      margin-top: 42px; /* Para não ficar atrás da navbar */
      margin-bottom: 40px; /* Para não ficar atrás da navbar inferior */
    }
  </style>
</head>
<body>

  <!-- NAVBAR BRANCA COM BOTÃO À DIREITA -->
  <div class="navbar">
    <a href="https://www.exemplo.com/doacao" target="_blank">
      <img src="donate-icon.svg" alt="Donate" class="donate-image">
    </a>
  </div>

  <!-- NAVBAR AMARELA -->
  <div class="navbar2 border">
    <a href="#frase?" class="active"></a>
  </div>

  <!-- CONTEÚDO PRINCIPAL -->
  <iframe src="https://lll7u7.wixstudio.com/today"></iframe>

</body>
</html>
