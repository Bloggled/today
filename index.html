<!DOCTYPE html>
<html>
<head>
  <link rel="shortcut icon" href="TPB.ico" type="image/x-icon">

  <!-- Fonte alternativa similar à "Old English Five" -->
  <link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:700&display=swap" rel="stylesheet">

  <style>
    body {
      background-color: #ffffff;
      margin: 0;
      padding: 0;
    }

    .navbar {
      overflow: hidden;
      background-color: #ffffff;
      position: fixed;
      top: 0;
      width: 100%;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    .navbar2-white-line {
      position: fixed;
      bottom: 44px; /* 40px da navbar2 + 4px da linha */
      width: 100%;
      height: 4px;
      background-color: #ffffff;
      z-index: 10000;
    }

    .navbar2 {
      overflow: hidden;
      position: fixed;
      bottom: 0;
      width: 100%;
      height: 40px;
      z-index: 9999;
      border: 4px solid #000000;
      display: flex;
      flex-direction: row;
    }

    .navbar2-left {
      background-color: #008635;
      width: 66%;
      height: 100%;
    }

    .navbar2-right {
      background-color: #ffffff;
      width: 34%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .buttom-image2 {
      height: 50px;
      width: 80px;
    }

    .logo-image {
      height: 20px;
    }

    iframe {
      width: 100%;
      height: 586px;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <!-- NAVBAR SUPERIOR -->
  <div class="navbar">
    <a href="https://www.exemplo.com/doacao" target="_blank">
      <img src="TPB-logo-extense3.svg" alt="Logo" class="logo-image">
    </a>
  </div>

  <!-- LINHA BRANCA FIXA FORA E ACIMA DA NAVBAR2 -->
  <div class="navbar2-white-line"></div>

  <!-- NAVBAR INFERIOR -->
  <div class="navbar2">
    <div class="navbar2-left"></div>
    <div class="navbar2-right">
      <a href="#stars" class="active">
        <img src="box-red.svg" alt="Imagem da navbar2" class="buttom-image2">
      </a>
    </div>
  </div>

  <!-- CONTEÚDO PRINCIPAL -->
  <iframe src="https://lll7u7.wixstudio.com/good-morning"></iframe>

</body>
</html>
