<!DOCTYPE html>
<html>
<head>
  <link rel="shortcut icon" href="TPB.ico" type="image/x-icon">

  <!-- Fonte alternativa similar à "Old English Five" -->
  <link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:700&display=swap" rel="stylesheet">

  <style>
    .navbar {
      overflow: hidden;
      background-color: #ffffff;
      position: fixed;
      top: 0;
      width: 100%;
      height: 42px;
      z-index: 9999;
      position: relative; /* Necessário para o posicionamento absoluto funcionar */
    }

    .navbar2 {
      overflow: hidden;
      background-color: #fecc00;
      position: fixed;
      bottom: 0;
      width: 100%;
      height: 40px;
      z-index: 9999;
    }

    body {
      background-color: #ffffff;
      margin: 0;
      padding: 0;
    }

    .border {
      border: 1px solid #ffffff;
    }

    .donate-image {
      height: 20px;
      position: absolute;
      top: 11px;   /* Centraliza verticalmente dentro da navbar de 42px */
      right: 10px; /* Distância da borda direita */
    }

    iframe {
      width: 100%;
      height: 586px;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <!-- NAVBAR BRANCA COM IMAGEM CLICÁVEL NO CANTO DIREITO SUPERIOR -->
  <div class="navbar">
    <a href="https://www.exemplo.com/doacao" target="_blank">
      <img src="donate-icon.svg" alt="Donate" class="donate-image">
    </a>
  </div>

  <!-- NAVBAR AMARELA -->
  <div class="navbar2 border">
    <a href="#frase?" class="active"></a>
  </div>

  <!-- CONTEÚDO PRINCIPAL -->
  <iframe src="https://lll7u7.wixstudio.com/today"></iframe>

</body>
</html>
