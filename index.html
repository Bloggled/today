<!DOCTYPE html> 
<html>
<head>
  <link rel="shortcut icon" href="TPB.ico" type="image/x-icon">
  <!-- Fonte "Old English Five" -->
  <link href="https://fonts.googleapis.com/css2?family=Old+English+Five&display=swap" rel="stylesheet">
  <style>
    .navbar {
      overflow: hidden;
      background-color: #ffffff;
      position: fixed;
      top: 0;
      width: 100%;
      height: 40px;
    }

    .navbar2 {
      overflow: hidden;
      background-color: #fecc00;
      position: fixed;
      bottom: 0;
      width: 100%;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    body {
      background-color: #ffffff;
      margin: 0;
      padding: 0;
    }

    .border {
      border: 1px solid #ffffff;
    }

    .donate-button {
      height: 20px;
      width: 100%;
      max-width: 150px; /* opcional: evita ficar largo demais */
      background-color: #000000;
      color: #ffffff;
      font-family: 'Old English Five', cursive;
      font-size: 14px;
      border: none;
      text-align: center;
      line-height: 20px;
      cursor: default;
      outline: none;
      margin: 10px auto; /* centraliza verticalmente dentro da navbar */
      display: block;
    }

    iframe {
      margin-top: 40px;
      margin-bottom: 40px;
      width: 100.8%;
      height: 586px;
      border: none;
    }
  </style>
</head>
<body>

  <div class="navbar">
    <button class="donate-button">Donate</button>
  </div>

  <div class="navbar2 border">
    <button class="donate-button">Donate</button>
  </div>

  <iframe src="https://lll7u7.wixstudio.com/today"></iframe>

</body>
</html>
